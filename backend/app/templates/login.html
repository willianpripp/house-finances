<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — {{ app_name }}</title>
    <script>
        // Same theme bootstrap as base.html, before Tailwind loads.
        (function() {
            try {
                var pref = localStorage.getItem('hf_theme');
                if (pref === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* fall back to light */ }
        })();
    </script>
    <script>
        // Muzzle Tailwind's unconditional production warning — see base.html.
        window.__warn = console.warn;
        console.warn = function (m) {
            if (typeof m === 'string' && m.indexOf('cdn.tailwindcss.com') === 0) return;
            window.__warn.apply(console, arguments);
        };
    </script>
    {# Vendored, not CDN — see static/vendor/README.md. #}
    <script src="/static/vendor/tailwind-3.4.17.js"></script>
    <script>
        console.warn = window.__warn;
        if (window.tailwind) { tailwind.config = { darkMode: 'class' }; }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css?v=16a0">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm mx-4">
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8">
            <div class="text-center mb-6">
                <div class="text-3xl mb-2">🏠</div>
                <h1 class="text-xl font-semibold text-slate-900">{{ app_name }}</h1>
                <p class="text-sm text-slate-500 mt-1">Sign in to continue</p>
            </div>

            {% if error %}
            <div class="mb-4 px-3 py-2 rounded bg-rose-50 text-rose-800 text-sm border border-rose-200">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-4">
                <input type="hidden" name="next" value="{{ next }}">
                <div>
                    <label for="login" class="block text-sm font-medium text-slate-700 mb-1">User</label>
                    <!-- type=text on purpose: logins are usernames (`users.name`),
                         email also accepted. type=email would block usernames
                         client-side, which is exactly how the first login
                         attempt failed on 2026-08-07. -->
                    <input id="login" name="login" type="text" required autofocus
                           autocomplete="username" placeholder="username"
                           class="w-full px-3 py-2 rounded border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" required
                           autocomplete="current-password"
                           class="w-full px-3 py-2 rounded border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                        class="w-full py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">
                    Sign in
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-slate-400 mt-4">
            Two-user household app. Passwords are set from the server terminal.
        </p>
    </div>
</body>
</html>
